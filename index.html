<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colony Namer</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:           #0a0e1a;
      --surface:      #111827;
      --surface2:     #1a2236;
      --border:       #1e3a5f;
      --border-dim:   #162840;
      --silver:       #a8b8cc;
      --silver-bright:#d0dde8;
      --silver-dim:   #5a6e82;
      --blue:         #2a5f9e;
      --blue-bright:  #3a7abf;
      --blue-dim:     #1a3a5e;
      --text:         #c8d8e8;
      --text-dim:     #6a7f94;
      --accent:       #4a9edd;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 4rem;
      background-image:
        radial-gradient(ellipse at 15% 30%, rgba(42,95,158,0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 70%, rgba(74,158,221,0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(26,58,94,0.2) 0%, transparent 60%);
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .star-ornament {
      color: var(--blue-bright);
      font-size: 0.8rem;
      letter-spacing: 0.8em;
      margin-bottom: 1rem;
      opacity: 0.7;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 600;
      color: var(--silver-bright);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    header .subtitle {
      margin-top: 0.6rem;
      font-size: 1rem;
      color: var(--text-dim);
      font-style: italic;
      letter-spacing: 0.06em;
    }

    /* ── DIVIDER ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
      margin: 1.8rem 0;
    }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      gap: 1rem;
      align-items: stretch;
    }

    .select-wrapper {
      flex: 1;
      position: relative;
    }

    .select-wrapper label {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--silver-dim);
      margin-bottom: 0.4rem;
    }

    select#blocSelect {
      width: 100%;
      padding: 0.75rem 2.2rem 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border-dim);
      color: var(--text);
      font-family: 'Crimson Pro', serif;
      font-size: 1rem;
      font-weight: 300;
      cursor: pointer;
      appearance: none;
      transition: border-color 0.2s;
      outline: none;
    }

    select#blocSelect:hover,
    select#blocSelect:focus {
      border-color: var(--blue);
    }

    select#blocSelect option {
      background: var(--surface);
      color: var(--text);
    }

    .select-arrow {
      position: absolute;
      right: 0.9rem;
      bottom: 0.85rem;
      color: var(--silver-dim);
      font-size: 0.7rem;
      pointer-events: none;
    }

    .btn-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    button#generate {
      padding: 0.75rem 2rem;
      background: transparent;
      border: 1px solid var(--blue);
      color: var(--silver-bright);
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    button#generate::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(42,95,158,0.2), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    button#generate:hover {
      border-color: var(--accent);
      color: var(--silver-bright);
      box-shadow: 0 0 24px rgba(74,158,221,0.15);
    }

    button#generate:hover::before { opacity: 1; }
    button#generate:active { transform: scale(0.98); }

    /* ── RESULTS ── */
    .results {
      margin-top: 2rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .results.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Colony name block */
    .colony-block {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.6rem 2rem;
      position: relative;
      margin-bottom: 1.5rem;
    }

    .colony-block::before,
    .colony-block::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--blue);
      border-style: solid;
    }
    .colony-block::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .colony-block::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

    .block-label {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--silver-dim);
      margin-bottom: 0.5rem;
    }

    .colony-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 600;
      color: var(--silver-bright);
      letter-spacing: 0.08em;
    }

    /* accordion toggle for colony */
    .accordion-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      cursor: pointer;
      color: var(--silver-dim);
      font-size: 0.82rem;
      font-style: italic;
      user-select: none;
      width: fit-content;
      transition: color 0.2s;
    }

    .accordion-toggle:hover { color: var(--accent); }

    .accordion-toggle .icon {
      font-style: normal;
      font-size: 1rem;
      line-height: 1;
      transition: transform 0.25s;
      color: var(--blue-bright);
    }

    .accordion-toggle.open .icon { transform: rotate(45deg); }

    .accordion-body {
      display: none;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border-dim);
    }

    .accordion-body.open { display: block; }

    .detail-row {
      display: grid;
      grid-template-columns: 5rem 1fr;
      gap: 0.3rem 1rem;
      padding: 0.25rem 0;
      font-size: 0.92rem;
    }

    .detail-label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue-bright);
      padding-top: 0.15rem;
    }

    .detail-value {
      color: var(--text);
      font-style: italic;
      line-height: 1.5;
    }

    /* Cities section */
    .cities-header {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--silver-dim);
      margin-bottom: 0.8rem;
    }

    .city-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .city-item {
      background: var(--surface);
      border: 1px solid var(--border-dim);
      padding: 0.7rem 1.1rem;
      transition: border-color 0.2s;
    }

    .city-item:hover { border-color: var(--border); }

    .city-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .city-number {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      color: var(--blue-dim);
      letter-spacing: 0.1em;
      min-width: 1.4rem;
    }

    .city-name {
      flex: 1;
      font-size: 1.05rem;
      color: var(--text);
    }

    .city-toggle {
      background: none;
      border: none;
      color: var(--silver-dim);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 0.2rem;
      transition: color 0.2s, transform 0.25s;
    }

    .city-toggle:hover { color: var(--accent); }
    .city-toggle.open { transform: rotate(45deg); color: var(--accent); }

    .city-details {
      display: none;
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--border-dim);
    }

    .city-details.open { display: block; }

    .city-details .detail-row {
      font-size: 0.88rem;
    }

    /* ── COPY BUTTON ── */
    .copy-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }

    button#copyBtn {
      padding: 0.5rem 1.2rem;
      background: transparent;
      border: 1px solid var(--border-dim);
      color: var(--silver-dim);
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button#copyBtn:hover {
      border-color: var(--blue);
      color: var(--silver-bright);
    }

    button#copyBtn.copied {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: var(--text-dim);
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    .empty-state .icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.8rem;
      opacity: 0.3;
    }

  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="star-ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
    <h1>Colony Namer</h1>
    <p class="subtitle">Draw names from the traditions of Earth's great civilisations</p>
  </header>

  <div class="divider"></div>

  <div class="controls">
    <div class="select-wrapper">
      <label for="blocSelect">Primary Founding Bloc</label>
      <select id="blocSelect">

             BLOCS LIST
             To add a new bloc: add an <option> here with the exact

        <option value="African">African</option>

        <option value="European">European</option>

        <option value="Middle Eastern">Middle Eastern</option>
        <option value="Persian">Persian</option>
        <option value="Southeast Asian">Southeast Asian</option>
        <option value="Indian Subcontinent">Indian Subcontinent</option>
      </select>
      <span class="select-arrow">▾</span>
    </div>
    <div class="btn-wrapper">
      <button id="generate">Generate</button>
    </div>
  </div>

  <div class="results" id="results">
    <div class="empty-state" id="emptyState">
      <span class="icon">🌐</span>
      Select a founding bloc and press Generate.
    </div>
    <div id="output" style="display:none;">
      <div class="colony-block">

        <div class="colony-name" id="colonyName"></div>
        <div class="accordion-toggle" id="colonyToggle">
          <span class="icon">+</span>
          <span>Origin &amp; notes</span>
        </div>
        <div class="accordion-body" id="colonyDetails">
          <div class="detail-row">
            <span class="detail-label">Bloc</span>
            <span class="detail-value" id="colonyBloc"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Notes</span>
            <span class="detail-value" id="colonyNotes"></span>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="copy-bar">
        <button id="copyBtn">Copy All</button>
      </div>

      <div class="cities-header">Settlement Names</div>
      <div class="city-list" id="cityList"></div>
    </div>
  </div>

  <div class="divider" style="margin-top:2rem;"></div>

</div>

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generate() {
  const primaryBloc = document.getElementById('blocSelect').value;

  // Split data by type and bloc
  const colonyNames = NAME_DATA.filter(e => e.type === 'colony' && e.bloc === primaryBloc);
  const primaryCities = NAME_DATA.filter(e => e.type === 'city' && e.bloc === primaryBloc);
  const otherCities = NAME_DATA.filter(e => e.type === 'city' && e.bloc !== primaryBloc);

  if (colonyNames.length === 0) {
    alert('No colony names found for this bloc. Check your data.');
    return;
  }

  if (primaryCities.length === 0 || otherCities.length === 0) {
    alert('Not enough city data to generate. Check your data.');
    return;
  }

  // Pick colony name
  const colony = pick(colonyNames);

  // Pick 20 cities:
  // Cities 1-2: always primary bloc
  // Cities 3-20: 40% primary bloc, 60% other blocs
  const cities = [];
  const usedNames = new Set();

  function pickUnique(pool) {
    const available = pool.filter(e => !usedNames.has(e.name));
    if (available.length === 0) return null;
    const chosen = pick(available);
    usedNames.add(chosen.name);
    return chosen;
  }

  // First 2 from primary bloc
  for (let i = 0; i < 2; i++) {
    const c = pickUnique(primaryCities);
    if (c) cities.push(c);
  }

  // Remaining 18
  for (let i = 0; i < 18; i++) {
    const fromPrimary = Math.random() < 0.4;
    let c = null;
    if (fromPrimary) {
      c = pickUnique(primaryCities);
      if (!c) c = pickUnique(otherCities);
    } else {
      c = pickUnique(otherCities);
      if (!c) c = pickUnique(primaryCities);
    }
    if (c) cities.push(c);
  }

  // Render colony
  document.getElementById('colonyName').textContent = colony.name;
  document.getElementById('colonyBloc').textContent = colony.bloc;
  document.getElementById('colonyNotes').textContent = colony.notes;

  // Reset colony accordion
  const colonyToggle = document.getElementById('colonyToggle');
  const colonyDetails = document.getElementById('colonyDetails');
  colonyToggle.classList.remove('open');
  colonyDetails.classList.remove('open');

  // Render cities
  const cityList = document.getElementById('cityList');
  cityList.innerHTML = '';

  cities.forEach((city, idx) => {
    const item = document.createElement('div');
    item.className = 'city-item';

    item.innerHTML = `
      <div class="city-item-top">
        <span class="city-number">${String(idx + 1).padStart(2, '0')}</span>
        <span class="city-name">${city.name}</span>
        <button class="city-toggle" aria-label="Show details">+</button>
      </div>
      <div class="city-details">
        <div class="detail-row">
          <span class="detail-label">Bloc</span>
          <span class="detail-value">${city.bloc}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Notes</span>
          <span class="detail-value">${city.notes}</span>
        </div>
      </div>
    `;

    const toggle = item.querySelector('.city-toggle');
    const details = item.querySelector('.city-details');
    toggle.addEventListener('click', () => {
      const isOpen = details.classList.contains('open');
      details.classList.toggle('open', !isOpen);
      toggle.classList.toggle('open', !isOpen);
      toggle.textContent = isOpen ? '+' : '×';
    });

    cityList.appendChild(item);
  });

  // Show output
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('output').style.display = 'block';

  const results = document.getElementById('results');
  results.classList.remove('visible');
  requestAnimationFrame(() => requestAnimationFrame(() => results.classList.add('visible')));
}

// Copy button
document.getElementById('copyBtn').addEventListener('click', () => {
  const colonyName  = document.getElementById('colonyName').textContent;
  const colonyBloc  = document.getElementById('colonyBloc').textContent;
  const colonyNotes = document.getElementById('colonyNotes').textContent;

  const cityItems = document.querySelectorAll('.city-item');
  const cityLines = Array.from(cityItems).map(item => {
    const name  = item.querySelector('.city-name').textContent.trim();
    const bloc  = item.querySelectorAll('.detail-value')[0].textContent.trim();
    const notes = item.querySelectorAll('.detail-value')[1].textContent.trim();
    return `* ${name} — ${bloc} — ${notes}`;
  });

  const text = [
    `Colony Name: ${colonyName}`,
    `Origin: ${colonyBloc} — ${colonyNotes}`,
    ``,
    `Cities:`,
    ...cityLines
  ].join('\n');

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy All';
      btn.classList.remove('copied');
    }, 2000);
  });
});

// Colony accordion
document.getElementById('colonyToggle').addEventListener('click', () => {
  const toggle = document.getElementById('colonyToggle');
  const details = document.getElementById('colonyDetails');
  const isOpen = details.classList.contains('open');
  details.classList.toggle('open', !isOpen);
  toggle.classList.toggle('open', !isOpen);
  toggle.querySelector('.icon').textContent = isOpen ? '+' : '×';
});

document.getElementById('generate').addEventListener('click', generate);

// Show results container on load
document.getElementById('results').classList.add('visible');
</script>
</body>
